name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here needs to write to the repository.
permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Restore and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AlgoJudge.sln

      # Warnings are reported but do not fail the build. NU1903 was the standing
      # exception here — AutoMapper 13.0.1 carried a high-severity advisory —
      # and it is gone with the package, so the restore above is clean.
      - name: Build
        run: dotnet build AlgoJudge.sln -c Release --no-restore

      # Testcontainers starts a real PostgreSQL 18 per run. Not an in-memory
      # provider: the job queue rests on FOR UPDATE SKIP LOCKED, on filtered
      # unique indexes and on two check constraints, none of which in-memory
      # has — a suite that passed on it would be testing a database this
      # product never runs on.
      - name: Test
        run: dotnet test AlgoJudge.sln -c Release --no-build

  docker:
    name: Build the container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Built but not pushed: no registry has been chosen yet. The build context
      # is the repository root, as the Compose file expects.
      - name: Build image
        run: docker build -f AlgoJudge.Server/Dockerfile -t algojudge-server:ci .

  compose:
    name: Start the development stack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # This is the documented way to run the Server locally, so it is worth
      # proving it still works. It caught the postgres image moving to 18, which
      # changed the expected volume mount and stopped the stack from starting.
      - name: Compose up
        run: docker compose -f example-server-development-docker-compose.yaml up -d --wait

      # `--wait` only waits for a healthcheck, and the application service has
      # none, so the container counts as up while the .NET host is still
      # starting. Poll instead of assuming.
      - name: The API answers
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "the API did not answer within 60s" >&2
          docker compose -f example-server-development-docker-compose.yaml logs --no-color algojudge >&2
          exit 1

      # The API lives under /api/v1 on every installation, so a bare path must
      # NOT answer. This is here because UsePathBase only strips the prefix when
      # it is present — it does not require it — so without an explicit guard
      # every endpoint quietly answers at both paths.
      - name: The API is not served at the root
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health)
          test "$code" = "404" || { echo "expected 404 at /health, got $code" >&2; exit 1; }

      - name: Migrations created the schema
        run: |
          docker compose -f example-server-development-docker-compose.yaml \
            exec -T postgres psql -U algojudge -d algojudge -c '\dt' | grep -q Activities

      # The two rules the schema is asked to defend on its own, checked as
      # schema rather than as behaviour: a file reference with no owner, and a
      # second Instance row. Both would also be caught by a service, and both
      # are the kind of rule a service forgets.
      - name: The database refuses a reference with no owner
        run: |
          docker compose -f example-server-development-docker-compose.yaml \
            exec -T postgres psql -U algojudge -d algojudge -c '\d "FileReferences"' \
            | grep -q 'CK_FileReferences_SingleOwner'

      - name: The instance table is a singleton
        run: |
          docker compose -f example-server-development-docker-compose.yaml \
            exec -T postgres psql -U algojudge -d algojudge -c '\d "Instance"' \
            | grep -q 'CK_Instance_Singleton'

      - name: Compose down
        if: always()
        run: docker compose -f example-server-development-docker-compose.yaml down -v
