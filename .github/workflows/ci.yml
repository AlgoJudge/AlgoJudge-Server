name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here needs to write to the repository.
permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Restore and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AlgoJudge.sln

      # Warnings are reported but do not fail the build. NU1903 was the standing
      # exception here — AutoMapper 13.0.1 carried a high-severity advisory —
      # and it is gone with the package, so the restore above is clean.
      - name: Build
        run: dotnet build AlgoJudge.sln -c Release --no-restore

      # Testcontainers starts a real PostgreSQL 18 per run. Not an in-memory
      # provider: the job queue rests on FOR UPDATE SKIP LOCKED, on filtered
      # unique indexes and on two check constraints, none of which in-memory
      # has — a suite that passed on it would be testing a database this
      # product never runs on.
      - name: Test
        run: dotnet test AlgoJudge.sln -c Release --no-build

  docker:
    name: Build the container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Built and not pushed, which is now a choice rather than a gap: a commit
      # proves the Dockerfile still builds, and `release.yml` publishes to
      # `ghcr.io/algojudge/algojudge-server` when somebody pushes a `v*` tag.
      # The build context is the repository root, as the Compose file expects.
      - name: Build image
        run: docker build -f AlgoJudge.Server/Dockerfile -t algojudge-server:ci .

  compose:
    name: Start the development stack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # This is the documented way to run the Server locally, so it is worth
      # proving it still works. It caught the postgres image moving to 18, which
      # changed the expected volume mount and stopped the stack from starting.
      - name: Compose up
        run: docker compose -f example-server-development-docker-compose.yaml up -d --wait

      # `--wait` only waits for a healthcheck, and the application service has
      # none, so the container counts as up while the .NET host is still
      # starting. Poll instead of assuming.
      - name: The API answers
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "the API did not answer within 60s" >&2
          docker compose -f example-server-development-docker-compose.yaml logs --no-color algojudge >&2
          exit 1

      # The API lives under /api/v1 on every installation, so a bare path must
      # NOT answer. This is here because UsePathBase only strips the prefix when
      # it is present — it does not require it — so without an explicit guard
      # every endpoint quietly answers at both paths.
      - name: The API is not served at the root
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health)
          test "$code" = "404" || { echo "expected 404 at /health, got $code" >&2; exit 1; }

      - name: Migrations created the schema
        run: |
          docker compose -f example-server-development-docker-compose.yaml \
            exec -T postgres psql -U algojudge -d algojudge -c '\dt' | grep -q Activities

      # The two rules the schema is asked to defend on its own, checked as
      # schema rather than as behaviour: a file reference with no owner, and a
      # second Instance row. Both would also be caught by a service, and both
      # are the kind of rule a service forgets.
      - name: The database refuses a reference with no owner
        run: |
          docker compose -f example-server-development-docker-compose.yaml \
            exec -T postgres psql -U algojudge -d algojudge -c '\d "FileReferences"' \
            | grep -q 'CK_FileReferences_SingleOwner'

      - name: The instance table is a singleton
        run: |
          docker compose -f example-server-development-docker-compose.yaml \
            exec -T postgres psql -U algojudge -d algojudge -c '\d "Instance"' \
            | grep -q 'CK_Instance_Singleton'

      # The committed OpenAPI document is the contract the Client is generated
      # and checked against, so it must not drift from what the Server actually
      # serves. Regenerated here and compared: a route added without updating it
      # fails the build rather than being noticed by whoever tries to call it.
      - name: The OpenAPI document matches what is served
        run: |
          curl -fsS http://127.0.0.1:8080/api/v1/swagger/v1/swagger.json -o served.json
          if ! diff -u openapi.json served.json > openapi.diff; then
            echo "openapi.json is out of date. Regenerate it and commit:" >&2
            head -60 openapi.diff >&2
            exit 1
          fi

      # Self-service registration is refused when the instance says it is closed,
      # which is how it ships. MapIdentityApi maps /register unconditionally, so
      # without the guard an installation that declares registration closed
      # accepts registrations anyway — and the account can then sign in.
      - name: Registration is closed by default
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8080/api/v1/identity/register \
            -H 'content-type: application/json' \
            -d '{"email":"intruder@example.invalid","password":"twelve-characters-at-least"}')
          test "$code" = "403" || { echo "expected 403 from /identity/register, got $code" >&2; exit 1; }

      # The operator's own tool, run in the image that ships it.
      #
      # It exists **because** the image has no curl and no wget, so the
      # alternative to running it here is a recipe in a document that nobody
      # executes and that rots the first time a path changes. What is checked is
      # what an operator would type, in the order they would type it — and that
      # the answer is a clean JSON document rather than the hexadecimal chunk
      # lengths an HTTP/1.1 request gets back.
      - name: The operator's tool works in the shipped image
        run: |
          compose="docker compose -f example-server-development-docker-compose.yaml"

          $compose exec -T algojudge aj-admin status | grep -q '"level":"open"'
          $compose exec -T algojudge aj-admin maintenance on 'ci checks the tool' \
            | grep -q '"reason":"ci checks the tool"'
          $compose exec -T algojudge aj-admin status | grep -qE '"level":"(draining|closed)"'
          $compose exec -T algojudge aj-admin maintenance off | grep -q '"level":"open"'

          # A wrong token is refused, and says so rather than failing silently.
          if $compose exec -T -e AJ_Admin__Token=not-the-token algojudge aj-admin status; then
            echo "a wrong admin token was accepted" >&2
            exit 1
          fi

          # Where the files are, and moving them. `storage status` names the
          # configured store, which the public health endpoint must never do —
          # and a second migration is refused while one is under way.
          $compose exec -T algojudge aj-admin storage status | grep -q '"isDefault":true'
          $compose exec -T algojudge aj-admin storage migrate
          if $compose exec -T algojudge aj-admin storage migrate; then
            echo "a second migration was accepted while one was under way" >&2
            exit 1
          fi
          $compose exec -T algojudge aj-admin storage cancel | grep -q '"state":"cancelled"'

      # The public health endpoint says one word about storage and names
      # nothing: no store, no backend, no bucket, no path.
      - name: Health does not disclose where the files are
        run: |
          body=$(curl -fsS http://127.0.0.1:8080/api/v1/health)
          echo "$body" | grep -qE '"storage":"(ok|degraded)"'             || { echo "no storage word in $body" >&2; exit 1; }
          if echo "$body" | grep -qE 'objects|bucket|rustfs|postgres|/data'; then
            echo "the public health answer named part of the storage: $body" >&2
            exit 1
          fi

      # The keys that encrypt a session cookie live in the database, and the
      # Server says which arrangement it is running. Two claims, so two checks:
      # a table can exist while nothing writes to it.
      - name: The key ring is in the database, and says so
        run: |
          compose="docker compose -f example-server-development-docker-compose.yaml"

          $compose exec -T postgres psql -U algojudge -d algojudge -c '\dt' \
            | grep -q DataProtectionKeys
          $compose logs --no-color algojudge | grep -q 'key ring: database'

      # **The promise of the item, end to end.** Everything above could hold
      # with the ring still in memory; only a restart asks the question the
      # release list asked. It is here rather than in the suite because the
      # suite cannot restart a process — two hosts share a machine, and a
      # machine-wide directory would carry a ring between them.
      - name: A restart does not sign anybody out
        run: |
          compose="docker compose -f example-server-development-docker-compose.yaml"
          jar=$(mktemp)

          curl -fsS -c "$jar" -o /dev/null -X POST \
            'http://127.0.0.1:8080/api/v1/identity/login?useSessionCookies=true' \
            -H 'content-type: application/json' \
            -d '{"email":"admin","password":"admin-development-only"}'

          grep -q 'AspNetCore.Identity.Application' "$jar" \
            || { echo "signing in left no identity cookie" >&2; exit 1; }

          $compose restart algojudge

          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/api/v1/health && break
            sleep 2
          done

          code=$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8080/api/v1/account)

          test "$code" = "200" || {
            echo "the session did not survive the restart: /account answered $code" >&2
            $compose logs --no-color algojudge | tail -40 >&2
            exit 1
          }

      # The key-ring commands, in the image that ships them, and against a live
      # session — because the whole difference between the two is what happens
      # to somebody who is signed in. Run last: the revoke ends every session on
      # the stack, so nothing after it could sign in with what it had.
      - name: The key-ring commands do what they say
        run: |
          compose="docker compose -f example-server-development-docker-compose.yaml"
          jar=$(mktemp)

          $compose exec -T algojudge aj-admin keyring status | grep -q '"kind":"database"'

          # Refused without the word, and the refusal is not a silent success.
          if $compose exec -T algojudge aj-admin keyring revoke; then
            echo "a revoke without --yes was accepted" >&2
            exit 1
          fi

          curl -fsS -c "$jar" -o /dev/null -X POST \
            'http://127.0.0.1:8080/api/v1/identity/login?useSessionCookies=true' \
            -H 'content-type: application/json' \
            -d '{"email":"admin","password":"admin-development-only"}'

          # **Rotate keeps everybody signed in.** That is the property that makes
          # it the safe half of the pair, and it is the one worth pinning.
          $compose exec -T algojudge aj-admin keyring rotate | grep -q '"isActive":true'
          code=$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8080/api/v1/account)
          test "$code" = "200" || { echo "a rotate signed somebody out: $code" >&2; exit 1; }

          # And revoke does not.
          $compose exec -T algojudge aj-admin keyring revoke --yes 'ci checks the tool' \
            | grep -q '"reason":"ci checks the tool"'
          code=$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8080/api/v1/account)
          test "$code" = "401" || { echo "a revoke left a session working: $code" >&2; exit 1; }

      - name: Compose down
        if: always()
        run: docker compose -f example-server-development-docker-compose.yaml down -v
