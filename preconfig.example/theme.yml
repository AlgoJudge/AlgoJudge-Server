# The colours and typeface an installation draws with.
#
# A file of its own beside algojudge.yml, with its own format and version — the
# same reason a page is a file rather than a string in a key. It is byte for
# byte the file the manager panel publishes, so a theme exported from the panel
# can be dropped in here and a theme written here can be read back in the panel.
#
# EVERY KEY IS OPTIONAL AND ABSENT MEANS THE PRODUCT'S DEFAULT. Not black, not
# empty — the colour AlgoJudge ships. A theme that states two keys changes two
# things and leaves the other thirty alone.
#
# A colour is six hexadecimal digits after a hash and nothing else: not a
# keyword, not rgb(), not var(). These values are written into a stylesheet, and
# a field that took anything else would let this file carry CSS.
#
# The values below are an example and belong to nobody. They exist so the
# development stack and CI read this path on every run — a template nothing
# executes is a template that rots — and the plum is deliberate: a stack that
# does not look like the default is a stack you can tell apart at a glance.
# Replace them, or delete this file and the installation looks as it ships.

format: algojudge-theme
version: 1

light:
  # The brand colour. One hex; the Client generates the ten shades from it, so
  # this one field reaches the buttons, the focus ring and the navigation.
  primary: "#6b4c9a"

dark:
  # Stated in full rather than derived from the light one. A dark scheme worked
  # out from a light colour fails a contrast floor unpredictably, and the
  # browser checks assert one.
  primary: "#a98cd8"

# A typeface is a file this installation stores, not a name it hopes the
# reader's machine has. Put the .woff2 faces in a `fonts/` directory beside this
# file and declare them here:
#
# fontFamily: "Example Sans"
# fontFamilyHeadings: "Example Sans"
# fonts:
#   - { family: "Example Sans", weight: 400, style: normal, file: example-400.woff2 }
#   - { family: "Example Sans", weight: 700, style: normal, file: example-700.woff2 }
#
# Naming a family with no face here is refused: a family nothing ships resolves
# to whatever the reader happens to have installed, which is not a theme. The
# generic names are the exception — system-ui, sans-serif, serif, monospace.
