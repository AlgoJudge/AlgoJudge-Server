name: algojudge-server

# **Bounded, and the same driver an installation uses.** Docker left to itself
# keeps an unbounded `json-file`, which on a machine that judges all afternoon is
# a full disk. `AlgoJudge-Ops` pins `local` on every service it ships; this file
# does the same so that what a developer runs behaves like what an operator runs.
#
# Literal values rather than `${...}`: an example that needs an `.env` before it
# starts is an example that does not.
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    # `local` compresses what it rotates unless told otherwise, and the daemon
    # refuses compression beside a single file. Three files, so it may stand.

services:

  postgres:
    logging: *logging
    # Pinned deliberately: an unpinned `postgres:latest` silently broke this
    # file once already, when the image moved to a new major.
    #
    # PostgreSQL 18 moved where data lives. PGDATA is now
    # /var/lib/postgresql/18/docker and the volume belongs one level up at
    # /var/lib/postgresql, so that a later `pg_upgrade --link` does not have to
    # cross a mount boundary. Mounting the old /var/lib/postgresql/data makes
    # the container refuse to start.
    #
    # A local volume created against an earlier major will not be picked up
    # after this change; remove it with `docker compose down -v` and let the
    # stack recreate the database.
    image: postgres:18
    volumes:
      - algojudge_dev_db_data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=algojudge
      - POSTGRES_USER=algojudge
      - POSTGRES_DB=algojudge
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algojudge -d algojudge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The local S3 endpoint, and **only** that.
  #
  # RustFS is the development endpoint; the conformance suite's reference
  # implementation is SeaweedFS, and this must never hold real submissions or
  # real test data (decided 2026-08-10, FILE_STORAGE.md §10.3). Pinned to an
  # exact tag for the same reason postgres is: an unpinned object store that
  # moves under a stack is a morning nobody planned.
  #
  # `1.0.0-rc.4` is a release candidate, which is the newest thing this image
  # publishes as a version. That is acceptable here and is one more reason this
  # service is development-only.
  #
  # Not published to the host, so nothing outside the Compose network reaches
  # it, and no console: the credentials below exist for this stack alone.
  rustfs:
    logging: *logging
    image: rustfs/rustfs:1.0.0-rc.4
    environment:
      # **The same two values the Server signs with**, substituted from one
      # place. They were written out twice until 2026-08-13, and a pair that has
      # to agree and is stated twice is a pair that eventually does not — the
      # failure being an authentication error naming nothing in particular.
      - RUSTFS_ACCESS_KEY=${AJ_STORAGE_ACCESS_KEY:-algojudge-development}
      - RUSTFS_SECRET_KEY=${AJ_STORAGE_SECRET_KEY:-algojudge-development-only}
    volumes:
      - algojudge_dev_objects:/data
    expose:
      - '9000'

  algojudge:
    logging: *logging
    build:
      context: .
      dockerfile: AlgoJudge.Server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    ports:
    - '127.0.0.1:8080:8080'
    environment:
    - DOTNET_ENVIRONMENT=Development
    - AJ_ConnectionStrings__DbConnectionString=Host=postgres;Database=algojudge;Username=algojudge;Password=algojudge
    # What `/admin/**` asks for on top of being called from inside the
    # container. **Empty closes the whole group** — including the only way to
    # set the administrator's password, which a fresh installation needs before
    # anybody can sign in at all. See `.env.example` and `docs/specs/MAINTENANCE.md`
    # in the workspace.
    - AJ_Admin__Token=${AJ_ADMIN_TOKEN:-admin-token-development-only}
    # **Where the files go, said out loud.** An installation that configures no
    # storage refuses to start (2026-08-12), so this is not decoration — it is
    # what makes the stack come up. `objects` is also the shipped default name,
    # so a deployment that follows this file needs no `Storage__Default`.
    - AJ_Storage__Stores__objects__Kind=s3
    - AJ_Storage__Stores__objects__Endpoint=http://rustfs:9000
    - AJ_Storage__Stores__objects__Bucket=algojudge
    - AJ_Storage__Stores__objects__AccessKey=${AJ_STORAGE_ACCESS_KEY:-algojudge-development}
    - AJ_Storage__Stores__objects__SecretKey=${AJ_STORAGE_SECRET_KEY:-algojudge-development-only}
    # **Development only.** Bucket creation belongs to the operator, because on
    # OVHcloud encryption at rest is applied when the bucket is made and cannot
    # be added convincingly afterwards (FILE_STORAGE.md §10.3, A61). This exists
    # so the stack comes up from nothing with one command, and it is off
    # everywhere else.
    - AJ_Storage__Stores__objects__CreateBucket=true
    # **Whose word to take for a visitor's address.** Nothing sits in front of
    # this stack - it is reached on 8080 directly - so `none` is the truth, and
    # `X-Forwarded-For` is read from nobody. A Server that named no answer at all
    # would refuse to start, deliberately: trusting every sender of that header
    # was the old default, and it lets a visitor state their own address. Behind
    # nginx this becomes the address the proxy reaches the Server from.
    - AJ_Forwarded__KnownProxies=none
    # **What this installation says about itself**, from files rather than from
    # somebody clicking through the panel. Applied at the first start of an
    # empty database and never again on a boot; afterwards it is
    # `aj-admin config apply`. The path is the mount below.
    #
    # Pointed at the committed example on purpose: a development stack
    # configured from it is a development stack that notices the day this stops
    # working. See `docs/specs/PRECONFIGURATION.md` in the workspace.
    - AJ_Preconfiguration__Path=/etc/algojudge/preconfig
    volumes:
    # Read-only, because nothing in the Server writes back to it and a
    # container that could rewrite its own configuration is a container that
    # can disagree with the repository it came from.
    - ./preconfig.example:/etc/algojudge/preconfig:ro

volumes:
  algojudge_dev_db_data:
  algojudge_dev_objects:
