name: algojudge-server

services:

  postgres:
    # Pinned deliberately. `postgres:latest` broke this file when the image
    # moved to PostgreSQL 18, which expects the volume at /var/lib/postgresql
    # rather than /var/lib/postgresql/data and refuses to start otherwise.
    # 16 is also inside the range Npgsql 8 is tested against. Moving to 17 or 18
    # means changing the mount path below and checking the Npgsql version.
    image: postgres:16
    volumes:
      - algojudge_dev_db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=algojudge
      - POSTGRES_USER=algojudge
      - POSTGRES_DB=algojudge
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algojudge -d algojudge"]
      interval: 10s
      timeout: 5s
      retries: 5

  algojudge:
    build:
      context: .
      dockerfile: AlgoJudge.Server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - '127.0.0.1:8080:8080'
    environment:
    - DOTNET_ENVIRONMENT=Development
    - AJ_ConnectionStrings__DbConnectionString=Host=postgres;Database=algojudge;Username=algojudge;Password=algojudge

volumes:
  algojudge_dev_db_data:
